name: Code Results

on: [push, pull_request]

jobs:
  mpi-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Compile MPI code
        run: |
          mpicc src_s.c -o src_s
          mpicc src_p.c -o src_p

      - name: Run MPI program and Get Results
        run: |
          echo "Running 64 * 64 * 64 * 3 on 8 processes - Sequential"
          mpirun -np 8 ./src_s inputFiles/data_64_64_64_3.bin.txt 2 2 2 64 64 64 3 output_64_64_64_3_8.txt
          cat output_64_64_64_3_8.txt

          echo "\n\nRunning 64 * 64 * 64 * 3 on 64 processes - Sequential"
          mpirun -np 64 ./src_s inputFiles/data_64_64_64_3.bin.txt 4 4 4 64 64 64 3 output_64_64_64_3_64.txt
          cat output_64_64_64_3_64.txt

          echo "\n\n\nRunning 64 * 64 * 96 * 7 on 8 processes - Sequential"
          mpirun -np 8 ./src_s inputFiles/data_64_64_96_7.bin.txt 2 2 2 64 64 96 7 output_64_64_96_7_8.txt
          cat output_64_64_96_7_8.txt

          echo "\n\nRunning 64 * 64 * 96 * 7 on 64 processes - Sequential"
          mpirun -np 64 ./src_s inputFiles/data_64_64_96_7.bin.txt 4 4 4 64 64 96 7 output_64_64_96_7_64.txt
          cat output_64_64_96_7_64.txt

          echo "Running 64 * 64 * 64 * 3 on 8 processes - Parallel I/O"
          mpirun -np 8 ./src_p inputFiles/data_64_64_64_3.bin.txt 2 2 2 64 64 64 3 output_64_64_64_3_8_p.txt
          cat output_64_64_64_3_8_p.txt

          echo "\n\nRunning 64 * 64 * 64 * 3 on 64 processes - Parallel I/O"
          mpirun -np 64 ./src_p inputFiles/data_64_64_64_3.bin.txt 4 4 4 64 64 64 3 output_64_64_64_3_64_p.txt
          cat output_64_64_64_3_64_p.txt

          echo "\n\n\nRunning 64 * 64 * 96 * 7 on 8 processes - Parallel I/O"
          mpirun -np 8 ./src_p inputFiles/data_64_64_96_7.bin.txt 2 2 2 64 64 96 7 output_64_64_96_7_8_p.txt
          cat output_64_64_96_7_8_p.txt

          echo "\n\nRunning 64 * 64 * 96 * 7 on 64 processes - Parallel I/O"
          mpirun -np 64 ./src_p inputFiles/data_64_64_96_7.bin.txt 4 4 4 64 64 96 7 output_64_64_96_7_64_p.txt
          cat output_64_64_96_7_64_p.txt

      - name: Upload Output Files
        uses: actions/upload-artifact@v4
        with:
          name: mpi-results
          path: |
            output_64_64_64_3_8.txt
            output_64_64_64_3_64.txt
            output_64_64_96_7_8.txt
            output_64_64_96_7_64.txt
            output_64_64_64_3_8_p.txt
            output_64_64_64_3_64_p.txt
            output_64_64_96_7_8_p.txt
            output_64_64_96_7_64_p.txt
