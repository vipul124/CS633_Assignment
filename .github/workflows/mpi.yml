  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v2

      - name: Compile test LaTeX document with Maths
        id: compile-latex-document-with-maths
        uses: ./
        with:
          output_dir: output
          main_latex_file: ./Group03.tex
          ctan_packages: graphicx amsmath listings xcolor tabularx
      - name: Upload PDF to the workflow tab
        id: upload-workflow-tab-maths
        uses: actions/upload-artifact@v2
        with:
          name: output
          path: output/test.pdf
      
      # - name: Compile LaTeX document with fontawesome
      #   id: compile-latex-document-with-fontawesome
      #   uses: ./
      #   with:
      #     output_dir: output
      #     main_latex_file: resources/test-fontawesome.tex
      #     ctan_packages: moderncv colortbl fontawesome lua-uni-algos
      # - name: Upload PDF to the workflow tab
      #   id: upload-workflow-tab-fontawesome
      #   uses: actions/upload-artifact@v2
      #   with:
      #     name: output-fontawesome
      #     path: output/test-fontawesome.pdf

      - name: Compile LaTeX document with TOC
        id: compile-latex-document-with-toc
        uses: ./
        with:
          output_dir: output
          main_latex_file: resources/test-toc.tex
          ctan_packages: lua-uni-algos
          toc: true
      - name: Upload PDF to the workflow tab
        id: upload-workflow-tab-toc
        uses: actions/upload-artifact@v4
        with:
          name: output-toc
          path: output/test-toc.pdf

  mpi-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Compile MPI code
        run: |
          mpicc src.c -o src

      - name: Run MPI program and Get Results
        run: |
          echo "Running 64 * 64 * 64 * 3 on 8 processes"
          mpirun -np 8 ./src inputFiles/data_64_64_64_3_bin.txt 2 2 2 64 64 64 3 output_64_64_64_3_8.txt
          cat output_64_64_64_3_8.txt

          echo "\n\nRunning 64 * 64 * 64 * 3 on 64 processes"
          mpirun -np 64 ./src inputFiles/data_64_64_64_3_bin.txt 4 4 4 64 64 64 3 output_64_64_64_3_64.txt
          cat output_64_64_64_3_64.txt

          echo "\n\n\nRunning 64 * 64 * 96 * 7 on 8 processes"
          mpirun -np 8 ./src inputFiles/data_64_64_96_7_bin.txt 2 2 2 64 64 96 7 output_64_64_96_7_8.txt
          cat output_64_64_96_7_8.txt

          echo "\n\nRunning 64 * 64 * 96 * 7 on 64 processes"
          mpirun -np 64 ./src inputFiles/data_64_64_96_7_bin.txt 4 4 4 64 64 96 7 output_64_64_96_7_64.txt
          cat output_64_64_96_7_64.txt

      - name: Upload Output Files
        uses: actions/upload-artifact@v4
        with:
          name: mpi-results
          path: |
            output_64_64_64_3_8.txt
            output_64_64_64_3_64.txt
            output_64_64_96_7_8.txt
            output_64_64_96_7_64.txt
